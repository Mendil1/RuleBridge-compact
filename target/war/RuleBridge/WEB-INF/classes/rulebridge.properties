# RuleBridge shared settings (safe to commit ? no secrets here)

chroma.host=localhost
chroma.port=8000
chroma.tenant=default_tenant
chroma.database=default_database
chroma.collection=rules_collection
chroma.rejected-collection=rules_rejected

model.path=D:/models/bge-m3
embedding.batch-size=15

excel.file-path=D:/projects/rag-java-migration-compact-dep/RuleBridge/Master_Rules_Audit_Report.xlsx

gemini.model=gemini-3.5-flash-lite
gemini.temperature=0.1
gemini.max-tokens=500

rag.default-top-k=3
rag.deduplicate=true

# --- Resilience (retry/backoff + per-service timeouts) ---
retry.max-attempts=4
retry.base-delay-ms=400
chroma.connect-timeout-sec=10
chroma.read-timeout-sec=30
gemini.connect-timeout-sec=15
gemini.read-timeout-sec=60

# --- API key policy ---
# true (recommended/production): GEMINI_API_KEY env var is mandatory; app fails fast if unset.
# false (local dev only): falls back to a saved/interactive key if the env var is missing.
auth.require-env-key=true
# Only relevant when auth.require-env-key=false. If true, an interactively typed key gets
# saved to ~/.rulebridge/users.properties so it isn't asked again. Off by default.
auth.persist-interactive-key=false