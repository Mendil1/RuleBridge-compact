<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuleBridge Enterprise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #f9fafb; }
        .sidebar-content { padding: 20px; flex: 1; overflow-y: auto; }
        
        /* Main Area */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { padding: 15px 30px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .workspace { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* Components */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
        input[type="text"], input[type="password"], textarea, select { 
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; box-sizing: border-box; 
        }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-ghost { background: transparent; color: var(--text-light); border: 1px solid var(--border); }
        .btn-ghost:hover { background: #f3f4f6; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        
        /* File List */
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f9fafb; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
        .file-item label { margin: 0; font-weight: normal; display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
        
        /* Code Block */
        .code-container { position: relative; background: #2d2d2d; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        .code-header { background: #1e1e1e; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; color: #ccc; font-size: 12px; }
        pre[class*="language-"] { margin: 0; border-radius: 0; max-height: 400px; overflow: auto; }
        .copy-btn { background: #444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .copy-btn:hover { background: #555; }
        
        /* Action Bar */
        .action-bar { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        
        /* Chat / Explain */
        .chat-area { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; display: none; }
        .chat-history { max-height: 300px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { padding: 10px 15px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.5; }
        .chat-user { background: #e0e7ff; color: #3730a3; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-ai { background: #f3f4f6; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 6px; color: white; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,0.1); animation: slideIn 0.3s ease; }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 600px; max-height: 80vh; border-radius: 8px; display: flex; flex-direction: column; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; color:var(--primary);"><i class="fas fa-bridge"></i> RuleBridge</h2>
            <p style="margin:5px 0 0; font-size:12px; color:var(--text-light);">Enterprise DSL Generator</p>
        </div>
        <div class="sidebar-content">
            <div class="form-group">
                <label><i class="fas fa-user"></i> ID Employé</label>
                <input type="text" id="empId" placeholder="ex: MENDIL" oninput="updateEmpId(this.value)">
            </div>
            <div class="form-group">
                <label><i class="fas fa-key"></i> Clé API Gemini</label>
                <input type="password" id="apiKey" placeholder="Votre clé API">
            </div>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
            
            <h3 style="font-size: 14px; margin-top:0;"><i class="fas fa-folder"></i> Mes Fichiers</h3>
            <div id="fileList" style="margin-bottom: 15px;"><em style="font-size:12px; color:#999;">Chargement...</em></div>
            
            <div class="card" style="background: #f9fafb; padding: 15px;">
                <h4 style="margin-top:0; font-size: 13px;">Ajouter un fichier</h4>
                <input type="text" id="newFileName" placeholder="Nom (ex: Credit Q3)" style="margin-bottom:8px;">
                <input type="file" id="exprFile" accept=".xlsx" style="margin-bottom:8px; font-size:12px;">
                <input type="file" id="ctrlFile" accept=".xlsx" style="margin-bottom:10px; font-size:12px;">
                <button class="btn btn-primary btn-sm" style="width:100%;" onclick="uploadFile()">
                    <i class="fas fa-upload"></i> Indexer
                </button>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main">
        <div class="topbar">
            <div style="display:flex; gap:15px; align-items:center;">
                <label style="margin:0; display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:normal;">
                    <input type="checkbox" id="includeGlobal" checked> 
                    <strong>🧠 Cerveau Global</strong>
                </label>
            </div>
            <button class="btn btn-ghost" onclick="openAudit()" style="margin-right:10px;">
                <i class="fas fa-shield-alt"></i> Audit
            </button>
            <button class="btn btn-ghost" onclick="openHistory()">
                <i class="fas fa-history"></i> Historique
            </button>
        </div>

        <div class="workspace">
            <!-- Prompt Card -->
            <div class="card">
                <label>Exigence Métier (Français)</label>
                <textarea id="prompt" placeholder="Ex: Vérifier que le montant ne dépasse pas 50k si l'âge < 35 ans..."></textarea>
                <div style="margin-top:15px; display:flex; justify-content:flex-end;">
                    <button class="btn btn-primary" onclick="generate()">
                        <i class="fas fa-magic"></i> Générer la Règle
                    </button>
                </div>
            </div>

            <!-- Result Card -->
            <div class="card" id="resultCard" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="margin:0;">Code Java / DSL</h3>
                    <span id="latencyBadge" style="background:#e0e7ff; color:#3730a3; padding:4px 8px; border-radius:12px; font-size:12px; font-weight:600;"></span>
                </div>
                
                <div class="code-container">
                    <div class="code-header">
                        <span>Java / BFI DSL</span>
                        <button class="copy-btn" onclick="copyCode()"><i class="fas fa-copy"></i> Copier</button>
                    </div>
                    <pre><code class="language-java" id="codeOutput"></code></pre>
                </div>

                <div class="action-bar">
                    <button class="btn btn-ghost" onclick="toggleContext()"><i class="fas fa-book"></i> Règles Sources</button>
                    <button class="btn btn-ghost" onclick="toggleRevise()"><i class="fas fa-edit"></i> Réviser</button>
                    <button class="btn btn-success" onclick="sendFeedback('approve')"><i class="fas fa-thumbs-up"></i> Approuver</button>
                    <button class="btn btn-danger" onclick="sendFeedback('reject')"><i class="fas fa-thumbs-down"></i> Rejeter</button>
                    <button class="btn btn-ghost" onclick="toggleExplain()"><i class="fas fa-question-circle"></i> Expliquer</button>
                </div>

                
                <!-- Context / Sources Area -->
                <div id="contextArea" class="chat-area" style="display:none;">
                    <h4 style="margin-top:0; color:var(--primary);"><i class="fas fa-book"></i> Exemples de référence utilisés (Few-Shot)</h4>
                    <div id="contextList" style="display: flex; flex-direction: column; gap: 15px;"></div>
                    
                    <div id="rejectedContextSection" style="margin-top: 20px; display:none;">
                        <h4 style="color:var(--danger);"><i class="fas fa-ban"></i> Contre-exemple évité</h4>
                        <div id="rejectedContextList"></div>
                    </div>
                </div>

                <!-- Revise Input -->
                <div id="reviseArea" style="margin-top:15px; display:none;">
                    <input type="text" id="feedbackInput" placeholder="Que faut-il changer ? (ex: ajouter un check null)">
                    <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="reviseCode()">Appliquer la révision</button>
                </div>

                <!-- Explain Chat -->
                <div id="explainArea" class="chat-area">
                    <div id="chatHistory" class="chat-history"></div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="questionInput" placeholder="Posez une question sur ce code..." style="flex:1;">
                        <button class="btn btn-primary" onclick="askQuestion()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0;">Historique des Corrections</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeHistory()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <button class="btn btn-primary btn-sm" onclick="loadPairs('approved')">Approuvés</button>
                    <button class="btn btn-ghost btn-sm" onclick="loadPairs('rejected')">Rejetés</button>
                </div>
                <div id="pairsList"></div>
            </div>
        </div>
    </div>

    
    <!-- Audit Modal -->
    <div id="auditModal" class="modal">
        <div class="modal-content" style="width: 900px;">
            <div class="modal-header">
                <h3 style="margin:0;"><i class="fas fa-shield-alt" style="color:var(--primary);"></i> Journal d'Audit (Conformité)</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeAudit()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 15px; display: flex; gap: 10px;">
                    <input type="text" id="auditSearch" placeholder="Rechercher dans les logs..." style="flex: 1;" oninput="renderAuditLogs()">
                    <button class="btn btn-ghost btn-sm" onclick="loadAuditLogs()"><i class="fas fa-sync"></i> Actualiser</button>
                </div>
                <div id="auditList" style="max-height: 60vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: #f9fafb;">
                    <em style="padding: 20px; display: block; text-align: center; color: #999;">Chargement des logs...</em>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js">
        // Audit Trail
        let auditData = [];
        function openAudit() { 
            document.getElementById('auditModal').style.display = 'flex'; 
            loadAuditLogs(); 
        }
        function closeAudit() { document.getElementById('auditModal').style.display = 'none'; }
        
        async function loadAuditLogs() {
            const list = document.getElementById('auditList');
            list.innerHTML = '<em style="padding: 20px; display: block; text-align: center; color: #999;">Chargement...</em>';
            try {
                const res = await fetch('/RuleBridge/audit');
                auditData = await res.json();
                renderAuditLogs();
            } catch(e) { list.innerHTML = '<em style="color:red; padding:20px;">Erreur de chargement.</em>'; }
        }

        function renderAuditLogs() {
            const list = document.getElementById('auditList');
            const search = document.getElementById('auditSearch').value.toLowerCase();
            
            const filtered = auditData.filter(log => 
                !search || 
                (log.prompt && log.prompt.toLowerCase().includes(search)) || 
                (log.code && log.code.toLowerCase().includes(search)) ||
                (log.action && log.action.toLowerCase().includes(search)) ||
                (log.userId && log.userId.toLowerCase().includes(search))
            );

            if(filtered.length === 0) {
                list.innerHTML = '<em style="padding: 20px; display: block; text-align: center; color: #999;">Aucun log trouvé.</em>';
                return;
            }

            list.innerHTML = filtered.map(log => {
                let actionColor = 'var(--primary)';
                if(log.action === 'APPROVE') actionColor = 'var(--success)';
                if(log.action === 'REJECT') actionColor = 'var(--danger)';

                return `
                <div style="padding: 15px; border-bottom: 1px solid var(--border); background: white;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <strong style="color: ${actionColor}; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px;">${log.action}</strong>
                        <span style="color: var(--text-light); font-size: 12px;">${log.timestamp} | <strong>${log.userId}</strong></span>
                    </div>
                    <div style="margin-bottom: 8px; font-size: 13px;"><strong>Prompt:</strong> ${escapeHtml(log.prompt)}</div>
                    <pre style="background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; margin: 0 0 8px 0; white-space: pre-wrap;">${escapeHtml(log.code)}</pre>
                    <div style="color: var(--text-light); font-size: 12px;"><strong>Details:</strong> ${escapeHtml(log.details)}</div>
                </div>`;
            }).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

    </script>

        let auditData = [];

        function closeAudit() { document.getElementById('auditModal').style.display = 'none'; }

    <script>
        // State
        let state = {
            empId: localStorage.getItem('empId') || '',
            apiKey: localStorage.getItem('apiKey') || '',
            mainCollection: null,
            rejectedCollection: null,
            currentResult: null,
            qaHistory: []
        };

        // Init
        
        function updateEmpId(val) {
            state.empId = val.trim();
            localStorage.setItem('empId', state.empId);
            if(state.empId) loadFiles();
        }

        window.onload = () => {
            document.getElementById('empId').value = state.empId;
            document.getElementById('apiKey').value = state.apiKey;
            loadFiles();
        };

        // Utils
        function showToast(msg, type='success') {
            const div = document.createElement('div');
            div.className = `toast toast-${type}`;
            div.innerText = msg;
            document.getElementById('toastContainer').appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function copyCode() {
            const code = document.getElementById('codeOutput').innerText;
            navigator.clipboard.writeText(code).then(() => showToast('Code copié !'));
        }

        // API Calls
        async function loadFiles() {
            const empId = document.getElementById('empId').value.trim();
            if(!empId) return;
            state.empId = empId;
            localStorage.setItem('empId', empId);
            
            try {
                const res = await fetch(`/RuleBridge/files?empId=${encodeURIComponent(empId)}`);
                const files = await res.json();
                renderFiles(files);
            } catch(e) { console.error(e); }
        }

        function renderFiles(files) {
            const list = document.getElementById('fileList');
            if(!files || files.length === 0) { list.innerHTML = '<em style="font-size:12px; color:#999;">Aucun fichier.</em>'; return; }
            list.innerHTML = files.map(f => `
                <div class="file-item">
                    <label>
                        <input type="checkbox" class="fileCheck" value="${f.id}" checked>
                        <span>${f.name} <small style="color:#999;">(${f.rules})</small></span>
                    </label>
                    <button class="btn btn-ghost btn-sm" style="color:var(--danger); padding:2px 6px;" onclick="deleteFile('${f.id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        async function uploadFile() {
            const empId = document.getElementById('empId').value.trim();
            const fileName = document.getElementById('newFileName').value.trim();
            const exprFile = document.getElementById('exprFile').files[0];
            const ctrlFile = document.getElementById('ctrlFile').files[0];
            
            if(!empId || !exprFile) return showToast('ID et fichier requis', 'error');
            
            const formData = new FormData();
            formData.append('empId', empId);
            formData.append('fileName', fileName);
            formData.append('exprFile', exprFile);
            if(ctrlFile) formData.append('ctrlFile', ctrlFile);
            
            showToast('Indexation en cours...', 'success');
            try {
                const res = await fetch('/RuleBridge/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) { showToast('Succès !'); loadFiles(); }
                else showToast(data.error, 'error');
            } catch(e) { showToast('Erreur réseau', 'error'); }
        }

        async function deleteFile(id) {
            if(!confirm('Supprimer ce fichier ?')) return;
            const formData = new URLSearchParams();
            formData.append('empId', state.empId);
            formData.append('action', 'delete');
            formData.append('fileId', id);
            await fetch('/RuleBridge/files', { method: 'POST', body: formData });
            loadFiles();
        }

        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const apiKey = document.getElementById('apiKey').value;
            const includeGlobal = document.getElementById('includeGlobal').checked;
            
            if(!state.empId) return showToast('Veuillez entrer un ID Employé.', 'error');
            if(!prompt || !apiKey) return showToast('Prompt et Clé API requis', 'error');
            state.apiKey = apiKey;
            localStorage.setItem('apiKey', apiKey);

            const selected = Array.from(document.querySelectorAll('.fileCheck:checked')).map(c => c.value);
            state.mainCollection = `rules_${state.empId}`;
            state.rejectedCollection = `rejected_${state.empId}`;

            const formData = new URLSearchParams();
            formData.append('empId', state.empId);
            formData.append('prompt', prompt);
            formData.append('apiKey', apiKey);
            formData.append('mainCollection', state.mainCollection);
            formData.append('rejectedCollection', state.rejectedCollection);
            formData.append('includeGlobal', includeGlobal);
            if(selected.length > 0) formData.append('selectedFiles', selected.join(','));

            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('codeOutput').innerText = 'Chargement...';
            document.getElementById('latencyBadge').innerText = '';
            
            try {
                const res = await fetch('/RuleBridge/generate', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.error) return showToast(data.error, 'error');
                
                state.currentResult = {
                    userPrompt: prompt,
                    generatedCode: data.generatedCode,
                    retrievedContext: data.retrievedContext || [],
                    retrievedRejected: data.retrievedRejected || []
                };
                state.qaHistory = []; // Reset chat history
                
                renderCode(data.generatedCode);
                document.getElementById('latencyBadge').innerText = `${data.latencySec.toFixed(2)}s`;
                document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
            } catch(e) { showToast('Erreur serveur', 'error'); }
        }

        function renderCode(code) {
            const el = document.getElementById('codeOutput');
            el.textContent = code; // Use textContent to escape HTML
            Prism.highlightElement(el);
        }

        
        function toggleContext() {
            const area = document.getElementById('contextArea');
            const isVisible = area.style.display === 'block';
            area.style.display = isVisible ? 'none' : 'block';
            
            // Close other drawers
            document.getElementById('reviseArea').style.display = 'none';
            document.getElementById('explainArea').style.display = 'none';

            if (!isVisible) renderContext();
        }

        function getSourceLabel(meta) {
            if (meta.source === 'global_master') return '🧠 Cerveau Global';
            if (meta.source === 'human_approved') return '👍 Approuvé (Historique)';
            if (meta.file_name) return `📁 Fichier: ${escapeHtml(meta.file_name)}`;
            return '📄 Base de données';
        }

        function renderContext() {
            const ctxList = document.getElementById('contextList');
            const contexts = state.currentResult.retrievedContext || [];
            
            if (contexts.length === 0) {
                ctxList.innerHTML = '<em style="color:var(--text-light);">Aucune règle de référence spécifique n\'a été trouvée pour cette génération.</em>';
            } else {
                ctxList.innerHTML = contexts.map((meta, index) => `
                    <div style="background: #f9fafb; border: 1px solid var(--border); border-radius: 6px; padding: 15px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <strong style="color: var(--primary);">Exemple #${index + 1}: ${escapeHtml(meta.code_regle || 'N/A')}</strong>
                            <span style="font-size: 12px; color: var(--text-light);">${getSourceLabel(meta)}</span>
                        </div>
                        <div style="font-size: 13px; margin-bottom: 8px; color: var(--text-light);">
                            <strong>Champ:</strong> ${escapeHtml(meta.nom_champ || '')} ${meta.libelle_champ ? '(' + escapeHtml(meta.libelle_champ) + ')' : ''}
                        </div>
                        <pre style="background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; margin: 0; white-space: pre-wrap;">${escapeHtml(meta.expression_java || '')}</pre>
                    </div>
                `).join('');
            }

            // Render Rejected Context
            const rejSection = document.getElementById('rejectedContextSection');
            const rejList = document.getElementById('rejectedContextList');
            const rejected = state.currentResult.retrievedRejected || [];
            
            if (rejected.length > 0) {
                rejSection.style.display = 'block';
                const meta = rejected[0];
                rejList.innerHTML = `
                    <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 15px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <strong style="color: var(--danger);">Code Rejeté: ${escapeHtml(meta.code_regle || 'N/A')}</strong>
                            <span style="font-size: 12px; color: var(--text-light);">Source: Historique des rejets</span>
                        </div>
                        <pre style="background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; margin: 0 0 8px 0; white-space: pre-wrap;">${escapeHtml(meta.expression_java || '')}</pre>
                        <div style="font-size: 13px; color: var(--danger);"><strong>Raison:</strong> ${escapeHtml(meta.reason || 'Non précisée')}</div>
                    </div>
                `;
            } else {
                rejSection.style.display = 'none';
            }
        }

        function toggleRevise() {
            const area = document.getElementById('reviseArea');
            area.style.display = area.style.display === 'none' ? 'block' : 'none';
            document.getElementById('explainArea').style.display = 'none';
        }

        function toggleExplain() {
            const area = document.getElementById('explainArea');
            area.style.display = area.style.display === 'none' ? 'flex' : 'none';
            document.getElementById('reviseArea').style.display = 'none';
        }

        async function reviseCode() {
            const feedback = document.getElementById('feedbackInput').value;
            if(!feedback) return;
            
            const formData = new URLSearchParams();
            formData.append('empId', state.empId);
            formData.append('prompt', state.currentResult.userPrompt);
            formData.append('previousCode', state.currentResult.generatedCode);
            formData.append('feedback', feedback);
            formData.append('apiKey', state.apiKey);
            
            document.getElementById('codeOutput').innerText = 'Révision en cours...';
            try {
                const res = await fetch('/RuleBridge/revise', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.error) return showToast(data.error, 'error');
                
                state.currentResult.generatedCode = data.generatedCode;
                renderCode(data.generatedCode);
                document.getElementById('feedbackInput').value = '';
                showToast('Code révisé !');
            } catch(e) { showToast('Erreur', 'error'); }
        }

        async function sendFeedback(action) {
            if(!state.empId) return showToast('Veuillez entrer un ID Employé.', 'error');
            let reason = '';
            if(action === 'reject') {
                reason = prompt('Raison du rejet (optionnel):');
                if(reason === null) return;
            }
            
            const formData = new URLSearchParams();
            formData.append('empId', state.empId);
            formData.append('action', action);
            formData.append('prompt', state.currentResult.userPrompt);
            formData.append('code', state.currentResult.generatedCode);
            formData.append('reason', reason);
            formData.append('mainCollection', state.mainCollection);
            formData.append('rejectedCollection', state.rejectedCollection);
            
            try {
                const res = await fetch('/RuleBridge/feedback', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) showToast(action === 'approve' ? 'Approuvé et sauvegardé !' : 'Rejet enregistré.');
            } catch(e) { showToast('Erreur', 'error'); }
        }

        async function askQuestion() {
            if(!state.empId) return showToast('Veuillez entrer un ID Employé.', 'error');
            const input = document.getElementById('questionInput');
            const q = input.value.trim();
            if(!q) return;
            
            const historyDiv = document.getElementById('chatHistory');
            historyDiv.innerHTML += `<div class="chat-msg chat-user">${q}</div>`;
            input.value = '';
            historyDiv.scrollTop = historyDiv.scrollHeight;
            
            const formData = new URLSearchParams();
            formData.append('prompt', state.currentResult.userPrompt);
            formData.append('generatedCode', state.currentResult.generatedCode);
            formData.append('question', q);
            formData.append('apiKey', state.apiKey);
            formData.append('contextJson', JSON.stringify(state.currentResult.retrievedContext || []));
            formData.append('rejectedJson', JSON.stringify(state.currentResult.retrievedRejected || []));
            formData.append('qaHistoryJson', JSON.stringify(state.qaHistory));
            
            try {
                const res = await fetch('/RuleBridge/explain', { method: 'POST', body: formData });
                const data = await res.json();
                const answer = data.answer || data.error || 'Pas de réponse.';
                
                historyDiv.innerHTML += `<div class="chat-msg chat-ai">${answer.replace(/\n/g, '<br>')}</div>`;
                historyDiv.scrollTop = historyDiv.scrollHeight;
                
                state.qaHistory.push([q, answer]);
            } catch(e) { historyDiv.innerHTML += `<div class="chat-msg chat-ai" style="color:red;">Erreur réseau</div>`; }
        }

        // History Modal
        function openHistory() { document.getElementById('historyModal').style.display = 'flex'; loadPairs('approved'); }
        function closeHistory() { document.getElementById('historyModal').style.display = 'none'; }
        
        async function loadPairs(type) {
            if(!state.empId) return showToast('Veuillez entrer un ID Employé.', 'error');
            const list = document.getElementById('pairsList');
            list.innerHTML = 'Chargement...';
            try {
                const res = await fetch(`/RuleBridge/pairs?type=${type}&mainCollection=${state.mainCollection}&rejectedCollection=${state.rejectedCollection}`);
                const pairs = await res.json();
                if(pairs.length === 0) { list.innerHTML = '<em>Aucun élément.</em>'; return; }
                
                list.innerHTML = pairs.map(p => `
                    <div class="card" style="margin-bottom:10px; padding:15px;">
                        <div style="font-weight:600; margin-bottom:5px;">${p.prompt}</div>
                        <pre style="background:#f3f4f6; padding:10px; font-size:12px; overflow:auto; max-height:100px;">${p.code}</pre>
                        ${p.reason ? `<div style="color:var(--danger); font-size:12px; margin-top:5px;">Raison: ${p.reason}</div>` : ''}
                        <button class="btn btn-danger btn-sm" style="margin-top:10px;" onclick="deletePair('${p.id}', '${type}')">Supprimer</button>
                    </div>
                `).join('');
            } catch(e) { list.innerHTML = 'Erreur'; }
        }

        async function deletePair(id, type) {
            if(!confirm('Supprimer ?')) return;
            const formData = new URLSearchParams();
            formData.append('action', 'delete');
            formData.append('type', type);
            formData.append('id', id);
            formData.append('mainCollection', state.mainCollection);
            formData.append('rejectedCollection', state.rejectedCollection);
            await fetch('/RuleBridge/pairs', { method: 'POST', body: formData });
            loadPairs(type);
        }
    
        // Audit Trail
        let auditData = [];
        function openAudit() { 
            document.getElementById('auditModal').style.display = 'flex'; 
            loadAuditLogs(); 
        }
        function closeAudit() { document.getElementById('auditModal').style.display = 'none'; }
        
        async function loadAuditLogs() {
            const list = document.getElementById('auditList');
            list.innerHTML = '<em style="padding: 20px; display: block; text-align: center; color: #999;">Chargement...</em>';
            try {
                const res = await fetch('/RuleBridge/audit');
                auditData = await res.json();
                renderAuditLogs();
            } catch(e) { list.innerHTML = '<em style="color:red; padding:20px;">Erreur de chargement.</em>'; }
        }

        function renderAuditLogs() {
            const list = document.getElementById('auditList');
            const search = document.getElementById('auditSearch').value.toLowerCase();
            
            const filtered = auditData.filter(log => 
                !search || 
                (log.prompt && log.prompt.toLowerCase().includes(search)) || 
                (log.code && log.code.toLowerCase().includes(search)) ||
                (log.action && log.action.toLowerCase().includes(search)) ||
                (log.userId && log.userId.toLowerCase().includes(search))
            );

            if(filtered.length === 0) {
                list.innerHTML = '<em style="padding: 20px; display: block; text-align: center; color: #999;">Aucun log trouvé.</em>';
                return;
            }

            list.innerHTML = filtered.map(log => {
                let actionColor = 'var(--primary)';
                if(log.action === 'APPROVE') actionColor = 'var(--success)';
                if(log.action === 'REJECT') actionColor = 'var(--danger)';

                return `
                <div style="padding: 15px; border-bottom: 1px solid var(--border); background: white;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <strong style="color: ${actionColor}; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px;">${log.action}</strong>
                        <span style="color: var(--text-light); font-size: 12px;">${log.timestamp} | <strong>${log.userId}</strong></span>
                    </div>
                    <div style="margin-bottom: 8px; font-size: 13px;"><strong>Prompt:</strong> ${escapeHtml(log.prompt)}</div>
                    <pre style="background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; margin: 0 0 8px 0; white-space: pre-wrap;">${escapeHtml(log.code)}</pre>
                    <div style="color: var(--text-light); font-size: 12px;"><strong>Details:</strong> ${escapeHtml(log.details)}</div>
                </div>`;
            }).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

    </script>
</body>
</html>
